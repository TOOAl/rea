<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title">
  <title id="title">팩트체크 코스피 6일 3번 급락 5단계 체크</title>
  <!-- 배경은 투명: 썸네일 일러스트 위에 오버레이 -->
  <!-- 좌하단 라벨 -->
  <g id="badge-factcheck">
    <rect x="28" y="28" rx="14" ry="14" width="220" height="52" fill="#0B1A3A" opacity="0.92"/>
    <text x="138" y="60" text-anchor="middle" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" letter-spacing="0.02em">팩트체크</text>
  </g>
  <!-- 우하단 고지: 수익화 필수 -->
  <g id="badge-disclaimer">
    <rect x="920" y="640" rx="10" ry="10" width="332" height="40" fill="#FFFFFF" opacity="0.92"/>
    <text x="1086" y="666" text-anchor="middle" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">투자 권유 아님 · 교육용</text>
  </g>
  <!-- 중앙 타이틀 카드 (코드 렌더링이므로 오타 검증 가능) -->
  <g id="title-card">
    <rect x="28" y="500" rx="20" ry="20" width="760" height="140" fill="#0B1A3A" opacity="0.94"/>
    <text x="60" y="550" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="38" font-weight="900" fill="#FFFFFF">코스피 6일 새 3번 급락</text>
    <text x="60" y="600" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="28" font-weight="700" fill="#7ED3FF">숫자 뒤 5단계 확인법</text>
  </g>
</svg>
