name: ci
on:
  push:
    branches: [main, 'arena/**']
    paths: ['arena-code/**', '.github/workflows/**']
  pull_request:
    paths: ['arena-code/**']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arena-code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: arena-code/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint --if-present || npx eslint src --ext .ts --max-warnings 0 || true
      - run: npm run build
      - run: npm test
